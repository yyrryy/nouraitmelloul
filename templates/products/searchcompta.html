{% extends 'base.html' %}
{% block menu_sales %}active{% endblock %}
{% block submenu_list_invoice %}active{% endblock %}
{% block content %}
    <div class="col-md-12">
       

            <div class="bg-white rounded shadow p-2">
                <table class="table table-striped table-advance table-hover table-bordered invoice-table">
                    <div class="input-group custom-search-form col-md-4" style="left: 5px">
                        <input type="text" class="form-control" onchange="searchcomptaresult(event)" placeholder="Chercher">
                        <span class="input-group-btn">
                            <button class="btn btn-default" type="button">
                                <i class="fa fa-search"></i>
                            </button>
                        </span>
                    </div>
                    <div class="d-flex justify-content-between mt-2">
                        <button type="button" class="btn border" onclick="showthis('facturestr')">Factures</button>
                        <button type="button" class="btn border" onclick="showthis('relevetr')">Releves</button>
                        <button type="button" class="btn border" onclick="showthis('devistr')">Devis</button>
                    </div>
                    <hr>
                    <thead>
                    <tr>
                        <th class="text-center"><i class=" fa fa-bookmark"></i> N°</th>
                        <th class="text-center"> Client</th>
                        <th class="text-center"> Total</th>
                        <th class="text-center"><i class=" fa fa-calendar"></i> Date</th>
                        <th class="text-center"></th>
                    </tr>
                    </thead>
                    <tbody class="product-table-body text-center">
                    
                    </tbody>
                </table>
                {% if paginator.page_range|length > 1 %}
                    <div class="text-center">
                        <ul class="pagination">
                            <li><a  style="background-color: #3070A8; color: white" class="page_previous" href="{% if page_obj.has_previous %}{% url 'sales:invoice_list' %}?page={{ page_obj.previous_page_number }}{% else %}#{% endif %}" title="Previous"><<</a></li>
                            <li><a style="background-color: #3070A8; color: white" class="page_next" href="{% if page_obj.has_next %}{% url 'sales:invoice_list' %}?page={{ page_obj.next_page_number }}{% else %}#{% endif %}" title="Next">>></a></li>
                        </ul>
                    </div>
                {% endif %}
            </div>
        </div>
<script>
    function searchcomptaresult(event){
        $.get('/product/searchcomptaresult', {
            'word':$(event.target).val(),
            'target':location.href.split('/')[4]
        },(data)=>{
            $('.product-table-body').html('')
            $('.product-table-body').html(data.html)
        })
    }
$('#invoice').on('click', function() {
    var $this = $(this);
  $this.button('loading');
    setTimeout(function() {
       $this.button('reset');
   }, 5000);
});

</script>
<script>
    function showthis(divclass){
        $('tr').fadeOut()
        $(`.${divclass}`).fadeIn()
    }
    function deleteFunction(e) {
        c=confirm("Supprimer ?");
        if (c==true){
            // go to a
            window.location.href=`/sales/delete/${e}`
        }
        else{
            return false;
        }
        }
</script>

{% endblock %}
